[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-media-manager"
version = "0.1.0"
description = "Distributed control plane and worker for safe drone media management."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "httpx",
    "keyring",
    "pillow",
]

[project.scripts]
dmm-worker = "drone_media_manager.cli.worker:main"
dmm-server = "drone_media_manager.cli.server:main"
dmm-catalog = "drone_media_manager.cli.catalog:main"
dmm-derivatives = "drone_media_manager.cli.derivatives:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.packages.find]
where = ["src"]
